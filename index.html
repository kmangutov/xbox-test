<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <title>Toddler Racing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #87ceeb;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    @media screen and (max-width: 768px) and (orientation: portrait) {
      body::before {
        content: "Please rotate your device to landscape mode";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #1a1a1a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 24px;
        padding: 20px;
        z-index: 9999;
      }
      #gameContainer {
        display: none;
      }
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1200px;
      max-height: 600px;
      background: #e0f4ff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #87ceeb;
    }
    #touchOverlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      justify-content: space-around;
      align-items: flex-end;
      padding: 10px;
    }
    #touchOverlay.show { display: flex; }
    .touch-control {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid #333;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      user-select: none;
    }
    .debug {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="touchOverlay">
      <div class="touch-control" id="steerLeft">←</div>
      <div class="touch-control" id="steerRight">→</div>
      <div class="touch-control" id="accelerate">🚗</div>
    </div>
    <div class="debug" id="debug"></div>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/input.js"></script>
  <script src="js/graphics.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
